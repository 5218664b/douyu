services:
  relay:
    image: ${DOUYU_RELAY_IMAGE:-douyu-relay:pi4b}
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "1935:1935"
    volumes:
      - ./configs/nginx-rtmp.conf:/etc/nginx/nginx.conf.template:ro
      - ./runtime:/app/runtime:ro

  app:
    image: ${DOUYU_STREAMER_IMAGE:-douyu-streamer:pi4b}
    restart: unless-stopped
    depends_on:
      - relay
    env_file:
      - .env
    environment:
      DOUYU_STREAMER_CONFIG: ${DOUYU_STREAMER_CONFIG:-/app/configs/app.yaml}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./configs/app.yaml:/app/configs/app.yaml:ro
      - ./data/videos:/data/videos:ro
      - ./runtime:/app/runtime

  scan-provider:
    image: ${DOUYU_SCAN_PROVIDER_IMAGE:-douyu-scan-provider-playwright:pi4b}
    profiles: ["scan"]
    stdin_open: true
    tty: true
    env_file:
      - .env
    environment:
      DOUYU_SCAN_HEADLESS: ${DOUYU_SCAN_HEADLESS:-true}
      DOUYU_SCAN_ROOM_URL: ${DOUYU_SCAN_ROOM_URL:-https://www.douyu.com/creator/main/live}
    volumes:
      - ./runtime:/app/runtime
